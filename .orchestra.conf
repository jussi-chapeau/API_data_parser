# Orchestra — per-repo settings. Copy to `.orchestra.conf` at the repo root and COMMIT it.
# Everything here is read by scripts/orchestra/orchestra-conf.sh, which supplies a default for
# anything you leave out. Nothing here is a secret: only key NAMES, never values.

# ---------------------------------------------------------------------------------------------
# 1 · The shared integration branch — where finished work from every developer lands.
#     Whatever your repo already calls it: main, master, develop, staging.
# TASSA REPOSSA: main-haaraa ei ole; origin/HEAD osoittaa tahan.
ORCHESTRA_BASE=integration/merge-claude-cursor

# ---------------------------------------------------------------------------------------------
# 2 · The developers and their long-lived branches, as "key=branch" pairs.
#     /conductor matches the key against git user.name / user.email and writes
#     ORCHESTRA_BASE=<that branch> into .orchestra.local (gitignored), so on each machine
#     players branch from and merge into that developer's own branch — never the shared one.
#
#     Create each branch once:  git checkout -b dev-alex main && git push -u origin dev-alex
#
#     SOLO? Leave this empty. /conductor then keeps the shared base above, and players branch
#     from it directly. That works, it just means no per-developer isolation.
ORCHESTRA_DEVS=""

# ---------------------------------------------------------------------------------------------
# 3 · Gitignored DIRECTORIES a fresh worktree needs. Copied with APFS clonefile (`cp -Rc`) where
#     available — seconds instead of a ten-minute reinstall. Missing ones are skipped silently.
#     Typical: node_modules, a virtualenv, a build cache. NOT your source tree.
# TASSA REPOSSA: tyhja. Ei .venv:ia eika node_modulesia -- pytest (9.1.1) tulee
# jarjestelma-Pythonista, joten pelaaja ei tarvitse kloonattavaa hakemistoa.
ORCHESTRA_CLONE_DIRS=""

# ---------------------------------------------------------------------------------------------
# 4 · Gitignored FILES a fresh worktree needs. Env files, local Claude settings.
#     These are copied into every player's worktree, so only list what a player must have.
# TASSA REPOSSA: .claude/settings.json pysyy gitignoroituna (se sisaltaa elavan N8N-avaimen
# ja repo on julkinen), joten se kulkee pelaajille TATA kautta eika versionhallinnasta.
ORCHESTRA_COPY_FILES=".env .claude/settings.json .claude/settings.local.json"

# ---------------------------------------------------------------------------------------------
# 5 · Credentials each developer needs locally, as "<file>:KEY,KEY,...", one file per line.
#     /conductor checks at sign-on that each key is PRESENT and non-empty. It never reads,
#     prints or copies a value.
#
#     WARNING, learned the hard way: the check is `grep '^KEY=.\+'` — it only proves the line is
#     not empty. Placeholder values pass it. "credentials complete" means "present", not "works".
#
#     Leave empty to skip the check entirely.
ORCHESTRA_ENV_KEYS=".env:SUPABASE_URL,SUPABASE_SERVICE_KEY,SUPABASE_ACCESS_TOKEN,BACKOFFICE_API_URL,BACKOFFICE_API_KEY,AIRTABLE_API_KEY,STRIPE_API_KEY,WINDSOR_API_KEY
"
# e.g. ORCHESTRA_ENV_KEYS=".env:DATABASE_URL,OPENROUTER_API_KEY
# "

# ---------------------------------------------------------------------------------------------
# 6 · First port a player may claim for its own dev server. Each player takes the first free one
#     from here up and writes it to its .claude/port. Keep your main checkout's own port below
#     this number so it never collides.
# TASSA REPOSSA: ei dev-serveria lainkaan (synkkiputki, ei palvelin), joten arvolla ei ole
# kaytannon merkitysta. Jos palvelin joskus lisataan, pida sen portti alle 8100:n.
ORCHESTRA_PORT_BASE=8100

# ---------------------------------------------------------------------------------------------
# 7 · The merge-time gate: `<path prefix>|<shell command>`, one rule per line.
#     The conductor runs a rule only when the merged range touched files under its prefix.
#     $FILES holds the touched files under that prefix. Exit 0 = green.
#
#     Keep these in step with whatever your CI runs. Two branches that are each green can be
#     red together — that is the whole reason this exists.
#
#     Spell the interpreter out (.venv/bin/python, not python3): the gate runs from the main
#     checkout in a plain shell, where a bare python3 may be the system one with nothing in it.
#
#     Never let a rule write into a COMMITTED build directory — it leaves the main checkout
#     dirty, which then blocks the conductor from opening any player. Build to a temp dir.
#
#     Empty = no gate. The conductor then reports "nothing to run" on every merge, honestly.
ORCHESTRA_GATES="scripts/|python3 -m pytest tests/ -q
tests/|python3 -m pytest tests/ -q
"

# Example rules — delete or adapt:
# ORCHESTRA_GATES="src/|npm test
# api/|.venv/bin/python -m pytest -q -x api/tests
# web/|cd web && npm run build -- --outDir \"\$(mktemp -d)/out\" --emptyOutDir
# "
